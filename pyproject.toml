[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cdmetro"
version = "0.1.0"
description = "Automated critical-dimension measurement on cross-section microscopy images"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Dheeraj Pavuluri" }]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "opencv-python-headless>=4.8",
    "matplotlib>=3.7",
    "fastapi>=0.110",
    "python-multipart>=0.0.9",
    "uvicorn>=0.27",
]

[project.optional-dependencies]
test = ["pytest>=7", "httpx>=0.25"]

[project.scripts]
cdmetro = "cdmetro.cli:main"

[tool.setuptools]
packages = ["cdmetro"]

[tool.pytest.ini_options]
testpaths = ["tests"]
